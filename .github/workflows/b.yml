on: [push]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/checkout@v4}
      - {run: unzip LiveCam.zip}
      - {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 17}}
      - {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.7}}
      - {run: cd LiveCam && gradle assembleDebug}
      - {uses: actions/upload-artifact@v4, with: {name: apk, path: LiveCam/app/build/outputs/apk/debug/app-debug.apk}}
